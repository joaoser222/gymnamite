services:
  app:
    container_name: gymnamite_app
    build:
      context: .
    image: ${APP_IMAGE:-gymnamite:local}
    depends_on:
      db:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
  db:
    container_name: gymnamite_db
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/init-test-database.sql:ro
  queue:
    container_name: gymnamite_queue
    build:
      context: .
    image: ${APP_IMAGE:-gymnamite:local}
    command: php artisan queue:work --tries=1 --timeout=0
    depends_on:
      db:
        condition: service_healthy
    profiles: ["worker"]

volumes:
  postgres_data:
    name: gymnamite_postgres_data

networks:
  default:
    name: gymnamite_network
