x-environment-file: &environment-file
  env_file:
    - ${ENV_FILE:-.env.develop}

services:
  app:
    build:
      context: .
    image: gymnamite:local
    command: >-
      sh -c 'php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000'
    depends_on:
      db:
        condition: service_healthy
    <<: *environment-file
    ports:
      - "8000:8000"

  db:
    image: postgres:17
    <<: *environment-file
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/init-test-database.sql:ro

  queue:
    build:
      context: .
    image: gymnamite:local
    command: php artisan queue:work --tries=1 --timeout=0
    depends_on:
      db:
        condition: service_healthy
    <<: *environment-file
    profiles: ["worker"]

  test:
    build:
      context: .
    image: gymnamite:local
    command: >-
      sh -c 'php artisan migrate:fresh --force --env=testing && php artisan test --compact'
    depends_on:
      db:
        condition: service_healthy
    <<: *environment-file
    environment:
      APP_ENV: testing
      DB_DATABASE: gymnamite_test
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    volumes:
      - ./docker/php/test-memory-limit.ini:/usr/local/etc/php/conf.d/zz-test-memory-limit.ini:ro
    profiles: ["test"]

volumes:
  postgres_data:
