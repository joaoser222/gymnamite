services:
  app:
    env_file:
      - production.env
    command: >-
      sh -c 'set -e;
      mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing storage/logs bootstrap/cache;
      chown -R www-data:www-data storage bootstrap/cache;
      cp -a /opt/public/. /var/www/html/public/;
      exec php-fpm'
    volumes:
      - public_assets:/var/www/html/public
      - laravel_storage:/var/www/html/storage
  caddy:
    container_name: gymnamite_caddy
    volumes:
      - public_assets:/var/www/html/public:ro
  db:
    env_file:
      - production.env
  queue:
    env_file:
      - production.env

volumes:
  laravel_storage:
    name: gymnamite_laravel_storage
  public_assets:
    name: gymnamite_public_assets
